# EKAFY - annexlkweb (static frontend + API proxy -> 127.0.0.1:4004)
server {
    server_name annexlkweb.ekafy.com;

    client_max_body_size 25m;

    # Block hidden files, except Let's Encrypt challenge files.
    location ~ /\.(?!well-known/) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block sensitive project, database, backup and configuration files.
    location ~* (^|/)(\.env|\.git|\.svn|\.hg|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|secrets?\.(json|ya?ml)|config\.(json|ya?ml|php)|.*\.(sql|bak|old|save|swp|dist))$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:4004;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    root /srv/annexlkweb/public;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /media/listings/ {
        alias /srv/annexlkweb/storage/public/listings/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Serve resized profile pictures from public storage.


location ^~ /media/avatars/ {
    alias /srv/annexlkweb/storage/public/avatars/;
    autoindex off;
    expires 30d;
    add_header Cache-Control "public, no-transform, immutable";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Avatar-Route "matched" always;
    access_log off;
}

    # Never expose private KYC documents.
    location /private/ {
        deny all;
        return 404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    access_log /srv/annexlkweb/logs/access.log;
    error_log  /srv/annexlkweb/logs/error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/annexlkweb.ekafy.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/annexlkweb.ekafy.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = annexlkweb.ekafy.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name annexlkweb.ekafy.com;
    return 404; # managed by Certbot
}
