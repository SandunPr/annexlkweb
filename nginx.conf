server {
    listen 80;
    listen [::]:80;
    server_name annexlk.com www.annexlk.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name annexlk.com www.annexlk.com;

    # SSL Certificates Configuration (Placeholders for Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/annexlk.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/annexlk.com/privkey.pem;
    
    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root Directory for Web Application Frontend
    root /var/www/annexlk/web;
    index index.html;

    # 1. Serve frontend single-page routing / assets
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # 2. Reverse Proxy for REST API requests
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP Forwarding
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload limits (Joi/Multer enforces 5MB in code, but Nginx needs buffer overhead check)
        client_max_body_size 20M;
    }

    # 3. Serve Property Images directly from VPS disk storage
    # Map URI: /media/listings/YYYY/MM/listing-ID/image.webp
    # Disk Path: /var/www/annexlk/public/listings/YYYY/MM/listing-ID/image.webp
    location /media/listings/ {
        alias /var/www/annexlk/public/listings/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # 4. Block access to Private storage folders (KYC ID cards)
    location /private/ {
        deny all;
        return 404;
    }

    # Error pages configuration
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
