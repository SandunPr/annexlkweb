<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rental Properties in Sri Lanka | Browse AnnexLK Listings</title>
  <meta name="description" content="Search annexes, boarding rooms, shared rooms, houses and apartments for rent in Sri Lanka. Refine results by city, university, price and tenant preference.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://annexlk.lk/pages/search.html">
  <meta property="og:title" content="Browse Rental Properties in Sri Lanka | AnnexLK">
  <meta property="og:description" content="Find Sri Lankan rental properties by city, university, monthly rent and tenant preference.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://annexlk.lk/pages/search.html">
  <meta property="og:site_name" content="AnnexLK">
  <meta property="og:image" content="https://annexlk.lk/assets/images/branding/banner.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Browse Rental Properties in Sri Lanka | AnnexLK">
  <meta name="twitter:description" content="Search annexes, boarding rooms, houses and apartments across Sri Lanka.">
  <meta name="twitter:image" content="https://annexlk.lk/assets/images/branding/banner.webp">
  
  <link rel="icon" type="image/svg+xml" href="/assets/images/branding/favicon.svg">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/forms.css">
  <link rel="stylesheet" href="/assets/css/responsive.css">
  


  <style>
    .search-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 30px;
      align-items: start;
    }
    .filters-sidebar {
      background-color: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 24px;
      position: sticky;
      top: calc(var(--header-height) + 20px);
      align-self: start;
      height: calc(100dvh - var(--header-height) - 40px);
      max-height: calc(100dvh - var(--header-height) - 40px);
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .search-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background-color: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 16px 24px;
    }
    .filter-sidebar-heading h3 { margin: 0; }
    .filter-close-btn, .mobile-filter-btn { display: none; }

    .filter-actions {
      position: sticky;
      bottom: -24px;
      z-index: 4;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
      gap: 10px;
      margin: 8px -24px -24px;
      padding: 14px 24px 24px;
      background: var(--surface);
      border-top: 1px solid var(--surface-border);
      box-shadow: 0 -8px 18px rgba(15, 23, 42, 0.08);
    }

    .filter-actions .btn {
      width: 100%;
      min-width: 0;
      margin: 0;
    }

    @media (max-width: 768px) {
      .filters-sidebar {
        padding-bottom: 0 !important;
        max-height: none;
      }

      .filter-actions {
        bottom: 0;
        margin: 8px -18px 0;
        padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
      }
    }

    /* Sponsored horizontal strip */
    .sponsored-strip {
      border: 1px dashed #f59e0b;
      background: linear-gradient(135deg, rgba(245,158,11,0.05), rgba(239,68,68,0.03));
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 20px;
      overflow: hidden;
      position: relative;
    }
    .sponsored-strip-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .sponsored-strip-badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .sponsored-strip-title {
      font-size: 11px;
      color: var(--text-muted);
    }
    .sponsored-strip-track {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      animation: strip-scroll 30s linear infinite;
      animation-play-state: running;
    }
    .sponsored-strip-track:hover { animation-play-state: paused; }
    .sponsored-strip-track::-webkit-scrollbar { display: none; }
    @keyframes strip-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .sponsored-chip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      text-decoration: none;
      color: inherit;
      font-size: 12px;
      white-space: nowrap;
      scroll-snap-align: start;
      transition: border-color 0.2s, transform 0.15s;
    }
    .sponsored-chip:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }
    .sponsored-chip-thumb {
      width: 34px; height: 34px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--surface-border);
      flex-shrink: 0;
    }
    .sponsored-chip-info strong { display: block; font-size: 12px; }
    .sponsored-chip-info span   { font-size: 10px; color: var(--text-muted); }
    .sponsored-chip-rent { font-weight: 700; color: var(--primary); font-size: 13px; margin-left: 4px; }

  </style>
</head>
<body>

  <header id="app-header"></header>

  <main class="main-layout">
    <div class="container">
      <div class="search-layout">
        
        <!-- Filters Sidebar (Desktop) -->
        <aside class="filters-sidebar" id="filters-sidebar" aria-label="Refine search">
          <div class="filter-sidebar-heading">
            <h3>Refine Search</h3>
            <button type="button" id="close-filters-btn" class="filter-close-btn" aria-label="Close search filters">&times;</button>
          </div>
          
          <form id="filter-form">
            <!-- Keyword search -->
            <div class="form-group">
              <label class="form-label">Keyword</label>
              <input type="text" id="filter-keyword" class="form-control" placeholder="WiFi, AC, Boarding...">
            </div>

            <!-- City search -->
            <div class="form-group">
              <label class="form-label">Select City</label>
              <select id="filter-city" class="form-control" data-searchable>
                <option value="">All Cities</option>
                <option value="1">Colombo 03</option>
                <option value="2">Colombo 07</option>
                <option value="3">Moratuwa</option>
                <option value="4">Kelaniya</option>
                <option value="5">Nugegoda</option>
                <option value="6">Peradeniya</option>
              </select>
            </div>

            <!-- Browser geolocation search; coordinates remain in memory only. -->
            <div class="form-group">
              <label class="form-label">Properties Near Me</label>
              <button type="button" id="use-location-btn" class="btn btn-outline" style="width:100%;">📍 Use My Current Location</button>
              <small id="location-status" class="text-muted" style="display:block; margin-top:8px; line-height:1.4;">Your browser will ask for location permission.</small>
            </div>

            <!-- University filter -->
            <div class="form-group">
              <label class="form-label">Near University</label>
              <select id="filter-university" class="form-control" data-searchable>
                <option value="">Select University</option>
                <option value="1">University of Moratuwa</option>
                <option value="2">University of Colombo</option>
                <option value="3">University of Kelaniya</option>
                <option value="4">University of Sri Jayewardenepura</option>
                <option value="5">University of Peradeniya</option>
              </select>
            </div>

            <!-- Proximity Distance -->
            <div class="form-group">
              <label class="form-label">Search Radius</label>
              <select id="filter-distance" class="form-control">
                <option value="" selected>Anywhere</option>
                <option value="10">Within 10 km</option>
                <option value="25">Within 25 km</option>
                <option value="50">Within 50 km</option>
                <option value="100">Within 100 km</option>
                <option value="200">Within 200 km</option>
              </select>
            </div>

            <!-- Property Type -->
            <div class="form-group">
              <label class="form-label">Property Type</label>
              <select id="filter-type" class="form-control" data-searchable>
                <option value="">Any Property Type</option>
                <option value="boarding_room">Boarding Room</option>
                <option value="shared_room">Shared Room</option>
                <option value="annex">Annex</option>
                <option value="house">House</option>
                <option value="apartment">Apartment</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Preferred Tenant</label>
              <select id="filter-gender" class="form-control">
                <option value="">Male or Female</option>
                <option value="MALE">Male</option>
                <option value="FEMALE">Female</option>
              </select>
            </div>

            <!-- Rent Range -->
            <div class="form-group">
              <label class="form-label">Monthly Rent Range (LKR)</label>
              <div class="flex gap-10">
                <input type="number" id="filter-min-rent" class="form-control" placeholder="Min" style="padding: 8px;">
                <input type="number" id="filter-max-rent" class="form-control" placeholder="Max" style="padding: 8px;">
              </div>
            </div>

            <!-- Verified check -->
            <div class="form-group">
              <label class="checkbox-label">
                <input type="checkbox" id="filter-verified" class="checkbox-control">
                <span>Verified Owners Only</span>
              </label>
            </div>

            <!-- Facilities checklist -->
            <div class="form-group">
              <label class="form-label">Required Facilities</label>
              <div style="display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; padding: 4px;">
                <label class="checkbox-label"><input type="checkbox" value="5" class="checkbox-control facility-checkbox"> <span>Wi-Fi / Internet</span></label>
                <label class="checkbox-label"><input type="checkbox" value="1" class="checkbox-control facility-checkbox"> <span>Attached Bathroom</span></label>
                <label class="checkbox-label"><input type="checkbox" value="4" class="checkbox-control facility-checkbox"> <span>Cooking Allowed</span></label>
                <label class="checkbox-label"><input type="checkbox" value="10" class="checkbox-control facility-checkbox"> <span>Air Conditioning</span></label>
                <label class="checkbox-label"><input type="checkbox" value="11" class="checkbox-control facility-checkbox"> <span>Parking Slot</span></label>
                <label class="checkbox-label"><input type="checkbox" value="15" class="checkbox-control facility-checkbox"> <span>Separate Entrance</span></label>
              </div>
            </div>

            <div class="filter-actions" aria-label="Filter actions">
              <button type="button" id="reset-filters" class="btn btn-outline">Reset</button>
              <button type="submit" id="apply-filters" class="btn btn-primary">Apply Filters</button>
            </div>
          </form>
        </aside>

        <!-- Search Results View -->
        <section class="results-container">
          
          <!-- Search Header toolbar -->
          <div class="search-header">
            <div>
              <span id="results-count" style="font-weight: 700; font-size: 18px;">Finding listings...</span>
            </div>
            
            <div class="flex gap-20 align-center">
              <button type="button" id="open-filters-btn" class="btn btn-primary mobile-filter-btn" aria-controls="filters-sidebar" aria-expanded="false">Refine Search</button>
              <!-- Sort selection -->
              <select id="sort-select" class="form-control" style="width: 150px; padding: 6px 12px; border-radius: var(--radius-sm);">
                <option value="best_match">Best Match</option>
                <option value="newest">Newest</option>
                <option value="lowest_rent">Rent: Low to High</option>
                <option value="highest_rent">Rent: High to Low</option>
                <option value="closest">Closest to Me</option>
              </select>
            </div>
          </div>

          <!-- Sponsored Listings Strip -->
          <div class="sponsored-strip" id="sponsored-strip" style="display:none;">
            <div class="sponsored-strip-header">
              <span class="sponsored-strip-badge">✦ Sponsored</span>
              <span class="sponsored-strip-title">Featured properties &middot; <a href="/pages/contact.html" style="color:var(--primary);">Promote your listing</a></span>
            </div>
            <div class="sponsored-strip-track" id="sponsored-strip-track"></div>
          </div>

          <!-- Empty State -->
          <div id="empty-state" class="hidden text-center" style="padding: 60px 20px;">
            <span style="font-size: 48px;">🔍</span>
            <h3 class="mt-20">No Listings Match Your Filters</h3>
            <p class="text-muted mt-10">Try clearing filters or adjusting your rent ranges and location filters.</p>
          </div>



          <!-- Listings card grid -->
          <div class="listing-grid" id="listings-grid">
            <!-- Dynamic listing card components loaded here -->
          </div>

          <!-- Pagination container -->
          <div id="pagination" class="flex justify-between align-center mt-40" style="padding-top: 20px; border-top: 1px solid var(--surface-border);">
            <button id="prev-page-btn" class="btn btn-outline" style="padding: 8px 16px;">&laquo; Previous</button>
            <span id="page-num-label" style="font-weight: 600; font-size: 14px;">Page 1 of 1</span>
            <button id="next-page-btn" class="btn btn-outline" style="padding: 8px 16px;">Next &raquo;</button>
          </div>

        </section>
      </div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script type="module">
    import Navigation from '/assets/js/utils/navigation.js?v=20260803-3';
    import client from '/assets/js/api/client.js';
    import UI from '/assets/js/components/ui.js';
    import Session from '/assets/js/state/session.js';
    import CONFIG from '/assets/js/config.js';
    import initSearchableSelects from '/assets/js/components/searchableSelect.js';

    let currentPage = 1;
    let listingsData = [];
    let userLocation = null;

    document.addEventListener('DOMContentLoaded', async () => {
      Navigation.init();
      await loadCityOptions();
      
      // Parse URL Query Params on start
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('cityId')) document.getElementById('filter-city').value = urlParams.get('cityId');
      if (urlParams.get('propertyType')) document.getElementById('filter-type').value = urlParams.get('propertyType');
      if (urlParams.get('preferredGender')) document.getElementById('filter-gender').value = urlParams.get('preferredGender');
      if (urlParams.get('maxRent')) document.getElementById('filter-max-rent').value = urlParams.get('maxRent');
      if (urlParams.get('universityId')) document.getElementById('filter-university').value = urlParams.get('universityId');
      initSearchableSelects();

      await fetchListings();

      // Bind Filter submits
      const filterForm = document.getElementById('filter-form');
      const filtersSidebar = document.getElementById('filters-sidebar');
      const openFiltersBtn = document.getElementById('open-filters-btn');
      const closeFiltersBtn = document.getElementById('close-filters-btn');

      function setFiltersOpen(isOpen) {
        filtersSidebar.classList.toggle('mobile-open', isOpen);
        openFiltersBtn.setAttribute('aria-expanded', String(isOpen));
        document.body.classList.toggle('filters-open', isOpen);
        (isOpen ? closeFiltersBtn : openFiltersBtn).focus();
      }

      openFiltersBtn.addEventListener('click', () => setFiltersOpen(true));
      closeFiltersBtn.addEventListener('click', () => setFiltersOpen(false));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && filtersSidebar.classList.contains('mobile-open')) setFiltersOpen(false);
      });

      filterForm.addEventListener('submit', (e) => {
        e.preventDefault();
        currentPage = 1;
        fetchListings();
        if (window.matchMedia('(max-width: 768px)').matches) setFiltersOpen(false);
      });

      document.getElementById('use-location-btn').addEventListener('click', requestUserLocation);

      // Reset filters
      document.getElementById('reset-filters').addEventListener('click', () => {
        filterForm.reset();
        userLocation = null;
        document.getElementById('location-status').textContent = 'Your browser will ask for location permission.';
        document.getElementById('use-location-btn').textContent = '📍 Use My Current Location';
        document.querySelectorAll('.facility-checkbox').forEach(cb => cb.checked = false);
        currentPage = 1;
        fetchListings();
      });



      // Bind sort changes
      document.getElementById('sort-select').addEventListener('change', () => {
        currentPage = 1;
        fetchListings();
      });

      // Bind pagination actions
      document.getElementById('prev-page-btn').addEventListener('click', () => {
        if (currentPage > 1) {
          currentPage--;
          fetchListings();
        }
      });
      document.getElementById('next-page-btn').addEventListener('click', () => {
        currentPage++;
        fetchListings();
      });
    });

    async function loadCityOptions() {
      const select = document.getElementById('filter-city');
      try {
        const response = await client.get('locations/cities');
        if (!response.success || !Array.isArray(response.data)) return;

        select.innerHTML = '';
        const allCities = new Option('All Cities', '');
        select.appendChild(allCities);
        response.data.forEach((city) => {
          select.appendChild(new Option(`${city.name} (${city.district_name})`, String(city.id)));
        });
      } catch (error) {
        // Keep the built-in options available if the reference-data request fails.
        console.warn('Could not load the latest city list:', error.message);
      }
    }

    function requestUserLocation() {
      const button = document.getElementById('use-location-btn');
      const status = document.getElementById('location-status');

      if (!navigator.geolocation) {
        status.textContent = 'Location search is not supported by this browser.';
        UI.showToast('Your browser does not support location search.', 'warning');
        return;
      }

      button.disabled = true;
      button.textContent = 'Finding your location…';
      status.textContent = 'Waiting for browser permission…';

      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLocation = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
          };

          // Avoid unintentionally combining current location with another location filter.
          ['filter-city', 'filter-university'].forEach((id) => {
            const select = document.getElementById(id);
            select.value = '';
            select.dispatchEvent(new Event('change', { bubbles: true }));
          });

          document.getElementById('sort-select').value = 'closest';
          button.disabled = false;
          button.textContent = '✓ Using My Location';
          const radius = document.getElementById('filter-distance').value;
          status.textContent = radius
            ? `Showing properties within ${radius} km. Your coordinates are not saved.`
            : 'Showing properties at any distance. Your coordinates are not saved.';
          currentPage = 1;
          fetchListings();
        },
        (error) => {
          const messages = {
            1: 'Location permission was denied. Allow location access in your browser settings to use this feature.',
            2: 'Your location is currently unavailable. Please try again.',
            3: 'Finding your location took too long. Please try again.',
          };
          userLocation = null;
          button.disabled = false;
          button.textContent = '📍 Use My Current Location';
          status.textContent = messages[error.code] || 'Unable to find your location.';
          UI.showToast(status.textContent, 'warning');
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
      );
    }

    /**
     * Query API search endpoints dynamically.
     */
    async function fetchListings() {
      const grid = document.getElementById('listings-grid');
      grid.innerHTML = Array(6).fill(`<div class="skeleton skeleton-img" style="height: 300px;"></div>`).join('');
      
      const params = new URLSearchParams();
      params.append('page', currentPage);
      params.append('limit', 20);
      
      // Map filters
      const keyword = document.getElementById('filter-keyword').value.trim();
      const city = document.getElementById('filter-city').value;
      const type = document.getElementById('filter-type').value;
      const preferredGender = document.getElementById('filter-gender').value;
      const minRent = document.getElementById('filter-min-rent').value;
      const maxRent = document.getElementById('filter-max-rent').value;
      const university = document.getElementById('filter-university').value;
      const distance = document.getElementById('filter-distance').value;
      const verified = document.getElementById('filter-verified').checked;
      const sortBy = document.getElementById('sort-select').value;

      if (keyword) params.append('keyword', keyword);
      if (city) params.append('cityId', city);
      if (type) params.append('propertyType', type);
      if (preferredGender) params.append('preferredGender', preferredGender);
      if (minRent) params.append('minRent', minRent);
      if (maxRent) params.append('maxRent', maxRent);
      if (university) {
        params.append('universityId', university);
        if (distance) params.append('universityDistance', distance);
      }
      if (userLocation) {
        params.append('latitude', userLocation.latitude.toFixed(6));
        params.append('longitude', userLocation.longitude.toFixed(6));
        if (distance) params.append('distance', distance);
      }
      if (verified) params.append('verifiedOwner', 'true');
      params.append('sortBy', sortBy);

      // Collect facilities checkboxes
      const facilityIds = [];
      document.querySelectorAll('.facility-checkbox:checked').forEach((cb) => {
        facilityIds.push(parseInt(cb.value, 10));
      });
      if (facilityIds.length > 0) {
        // Joi checks arrays passed in query
        facilityIds.forEach(id => params.append('facilityIds', id));
      }

      try {
        const res = await client.get(`search?${params.toString()}`);
        if (res.success) {
          listingsData = res.data;
          renderListings(listingsData);
          updatePaginationUI(res.meta.pagination);


        }
      } catch (err) {
        UI.showToast('Search execution failed: ' + err.message, 'error');
      }
    }

    /**
     * Build HTML cards dynamic rendering.
     */
    function renderListings(listings) {
      const grid = document.getElementById('listings-grid');
      const empty = document.getElementById('empty-state');
      const countLabel = document.getElementById('results-count');

      countLabel.innerText = `${listings.length} Property Listing(s) Found`;

      if (listings.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      
      grid.innerHTML = listings.map((p) => {
        const mainThumbnail = p.main_thumbnail || 'https://images.unsplash.com/photo-1513694203232-719a280e022f?w=400&q=70'; // fallback gorgeous design
        
        let kycBadge = '';
        if (p.owner_kyc_status === 'IDENTITY_VERIFIED' || p.owner_kyc_status === 'TRUSTED_OWNER') {
          kycBadge = `<span class="badge badge-verify" title="Verified Owner Identity">🛡️ Verified</span>`;
        }

        const isFav = Session.isAuthenticated() && localStorage.getItem(`fav-${p.id}`) === 'true';

        // Use the physical listing page so previews also work on static hosts
        // that do not support Nginx's /property/:slug rewrite.
        const listingUrl = `/pages/listing.html?slug=${encodeURIComponent(p.slug)}`;

        return `
          <div class="listing-card" data-listing-url="${listingUrl}" role="link" tabindex="0" aria-label="View listing preview">
            <div class="card-img-container">
              <img src="${mainThumbnail}" class="card-img" alt="${p.title}" loading="lazy">
              
              <button class="fav-btn ${isFav ? 'active' : ''}" data-id="${p.id}" title="Save Favourite">
                ❤️
              </button>

              <div class="card-badge-container">
                <span class="badge badge-secondary">${p.property_type.replace('_', ' ')}</span>
                <span class="badge badge-primary">${p.preferred_gender === 'MALE' ? 'Male' : p.preferred_gender === 'FEMALE' ? 'Female' : 'Male or Female'}</span>
                ${kycBadge}
              </div>
            </div>
            
            <div class="card-content">
              <div class="card-price">${parseFloat(p.rent).toLocaleString()} LKR<span> / month</span></div>
              <a href="${listingUrl}" class="card-title">${p.title}</a>
              
              <div class="card-location">
                <span>📍</span> ${p.address_text || p.city_name}
                ${p.distance !== undefined ? `<small class="text-muted"> · about ${Number(p.distance).toFixed(1)} km away</small>` : ''}
              </div>
              
              <div class="card-meta">
                <span>🛏️ Occupants: ${p.current_occupants}/${p.max_occupants}</span>
                <span>📅 Available: ${p.available_date.substring(0, 10)}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Bind Favourites action listeners
      grid.querySelectorAll('.fav-btn').forEach((btn) => {
        btn.addEventListener('click', async (e) => {
          e.stopPropagation();
          const propertyId = btn.getAttribute('data-id');
          await toggleFavourite(btn, propertyId);
        });
      });

      // Make the complete search-result card open its listing preview. Keep
      // buttons and links independently interactive.
      grid.querySelectorAll('.listing-card').forEach((card) => {
        const openListing = () => {
          window.location.href = card.dataset.listingUrl;
        };

        card.addEventListener('click', (event) => {
          if (event.target.closest('a, button')) return;
          openListing();
        });

        card.addEventListener('keydown', (event) => {
          if ((event.key === 'Enter' || event.key === ' ') && !event.target.closest('a, button')) {
            event.preventDefault();
            openListing();
          }
        });
      });
    }

    async function toggleFavourite(button, propertyId) {
      if (!Session.isAuthenticated()) {
        UI.showToast('Please log in as a renter to save favourites.', 'warning');
        return;
      }

      const active = button.classList.contains('active');
      try {
        if (active) {
          const res = await client.delete(`favourites/${propertyId}`);
          if (res.success) {
            button.classList.remove('active');
            localStorage.removeItem(`fav-${propertyId}`);
            UI.showToast('Removed from favourites.', 'success');
          }
        } else {
          const res = await client.post(`favourites/${propertyId}`);
          if (res.success) {
            button.classList.add('active');
            localStorage.setItem(`fav-${propertyId}`, 'true');
            UI.showToast('Added to favourites!', 'success');
          }
        }
      } catch (err) {
        UI.showToast(err.message || 'Operation failed.', 'error');
      }
    }

    function updatePaginationUI(pageInfo) {
      const label = document.getElementById('page-num-label');
      const prevBtn = document.getElementById('prev-page-btn');
      const nextBtn = document.getElementById('next-page-btn');

      label.innerText = `Page ${pageInfo.page} of ${pageInfo.totalPages || 1}`;
      
      prevBtn.disabled = pageInfo.page <= 1;
      nextBtn.disabled = pageInfo.page >= pageInfo.totalPages;
    }


    // ── Sponsored Strip ────────────────────────────────────────────────
    (async () => {
      try {
        const res = await client.get('listings/featured');
        const items = (res && res.data) || [];
        if (items.length === 0) return;
        const track = document.getElementById('sponsored-strip-track');
        // Duplicate for infinite scroll illusion
        [...items, ...items].forEach(p => {
          const a = document.createElement('a');
          a.className = 'sponsored-chip';
          a.href = `/pages/listing.html?slug=${encodeURIComponent(p.slug)}`;
          const imgSrc = p.main_thumbnail ? `${p.main_thumbnail}` : '';
          const imgHTML = imgSrc
            ? `<img class="sponsored-chip-thumb" src="${imgSrc}" alt="" loading="lazy">`
            : `<div class="sponsored-chip-thumb" style="display:flex;align-items:center;justify-content:center;font-size:18px;">🏠</div>`;
          a.innerHTML = `${imgHTML}<div class="sponsored-chip-info"><strong>${p.city_name || ''}</strong><span>${(p.property_type||'').replace(/_/g,' ')}</span></div><span class="sponsored-chip-rent">LKR ${Number(p.rent).toLocaleString()}</span>`;
          track.appendChild(a);
        });
        document.getElementById('sponsored-strip').style.display = 'block';
      } catch (_) { /* non-critical */ }
    })();

  </script>
</body>
</html>
